<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- ゴミ収集車のイラスト（手描きSVG） -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#e6f7ff"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffb300" stop-opacity=".9"/><stop offset="1" stop-color="#ffb300" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- 空・地面 -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="95" r="48" fill="#ffe082"/>
  <g fill="#fff" opacity=".9">
    <ellipse cx="150" cy="110" rx="60" ry="28"/><ellipse cx="195" cy="95" rx="45" ry="30"/><ellipse cx="110" cy="100" rx="40" ry="24"/>
    <ellipse cx="480" cy="70" rx="50" ry="22"/><ellipse cx="515" cy="58" rx="38" ry="24"/>
  </g>
  <rect y="430" width="800" height="50" fill="#8bc34a"/>
  <rect y="470" width="800" height="130" fill="#9e9e9e"/>
  <rect y="530" width="800" height="8" fill="#fff" opacity=".8" stroke-dasharray="40 30" stroke="#fff"/>
  <line x1="0" y1="534" x2="800" y2="534" stroke="#fff" stroke-width="8" stroke-dasharray="40 30"/>
  <!-- ゴミ袋 -->
  <g stroke="#333" stroke-width="4" stroke-linejoin="round">
    <path d="M700 470 q-20 -60 20 -80 q40 20 20 80 z" fill="#4dd0e1"/>
    <path d="M745 472 q-18 -50 15 -66 q34 16 18 66 z" fill="#aed581"/>
    <path d="M712 392 l-8 -14 M728 392 l8 -14" fill="none"/>
  </g>
  <!-- 影 -->
  <ellipse cx="420" cy="480" rx="330" ry="18" fill="#000" opacity=".15"/>
  <!-- 車体（後ろの箱） -->
  <g stroke="#3e2723" stroke-width="6" stroke-linejoin="round">
    <path d="M300 200 h330 q60 0 70 60 v170 h-400 z" fill="#f5f2e8"/>
    <!-- 後ろの投入口 -->
    <path d="M630 260 q70 0 70 70 v100 h-80 v-170 z" fill="#d7d2c4"/>
    <rect x="640" y="330" width="45" height="70" rx="8" fill="#5d4037"/>
    <!-- オレンジの帯 -->
    <rect x="300" y="345" width="330" height="26" fill="#ff8f00" stroke="none"/>
    <!-- 運転席 -->
    <path d="M120 300 q0 -60 60 -60 h120 v190 h-180 z" fill="#1e88e5"/>
    <path d="M150 300 q0 -40 40 -40 h80 v80 h-120 z" fill="#d6f0ff"/>
    <rect x="160" y="350" width="70" height="50" rx="6" fill="#1565c0" stroke-width="4"/>
    <rect x="128" y="400" width="24" height="16" rx="4" fill="#ffee58" stroke-width="4"/>
    <!-- シャーシ・バンパー -->
    <rect x="110" y="415" width="600" height="28" rx="6" fill="#455a64"/>
    <rect x="100" y="425" width="40" height="22" rx="6" fill="#78909c" stroke-width="4"/>
  </g>
  <!-- 回転灯 -->
  <circle cx="200" cy="232" r="46" fill="url(#glow)"/>
  <rect x="180" y="218" width="40" height="22" rx="6" fill="#ff6f00" stroke="#3e2723" stroke-width="5"/>
  <!-- リサイクルマーク -->
  <text x="440" y="310" font-size="84" text-anchor="middle" fill="#43a047" font-family="Segoe UI Symbol, Noto Sans Symbols, sans-serif">♻</text>
  <!-- タイヤ -->
  <g stroke="#222" stroke-width="6">
    <circle cx="200" cy="450" r="48" fill="#333"/><circle cx="200" cy="450" r="22" fill="#cfd8dc"/><circle cx="200" cy="450" r="7" fill="#546e7a"/>
    <circle cx="520" cy="450" r="48" fill="#333"/><circle cx="520" cy="450" r="22" fill="#cfd8dc"/><circle cx="520" cy="450" r="7" fill="#546e7a"/>
    <circle cx="620" cy="450" r="48" fill="#333"/><circle cx="620" cy="450" r="22" fill="#cfd8dc"/><circle cx="620" cy="450" r="7" fill="#546e7a"/>
  </g>
  <!-- 運転手 -->
  <circle cx="220" cy="300" r="18" fill="#ffcc80" stroke="#3e2723" stroke-width="4"/>
  <path d="M198 292 q22 -22 44 0" fill="#ff8f00" stroke="#3e2723" stroke-width="4"/>
  <circle cx="214" cy="302" r="2.5" fill="#333"/><circle cx="226" cy="302" r="2.5" fill="#333"/>
  <path d="M212 310 q8 6 16 0" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
</svg>
